<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E N Y 0 // OSINT TERMINAL</title>
    <style>
        /* Cyberpunk Theme Variables */
        :root {
            --bg: #0a0a0c;
            --panel-bg: #111116;
            --text-main: #00ffcc;
            --accent-1: #ff005c;
            --accent-2: #bc13fe;
            --border: 1px solid var(--text-main);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            /* Animated Grid Background */
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridScroll 3s linear infinite;
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Seamless Infinite Grid Animation */
        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* CRT Scanline Overlay */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 5;
            pointer-events: none;
        }

        /* Responsive Header */
        #header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--accent-1);
            color: #fff;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            display: none;
            z-index: 10;
            text-shadow: 0 0 5px #000;
        }

        /* Main Terminal Container */
        .container {
            width: 90%;
            max-width: 700px;
            background: var(--panel-bg);
            border: var(--border);
            /* New 3D Box Shadow Setup */
            box-shadow: 
                10px 10px 0px rgba(255, 0, 92, 0.8),    /* Sharp 3D pink shadow */
                -4px -4px 0px rgba(188, 19, 254, 0.3),  /* Subtle 3D purple shadow */
                0 0 15px rgba(0, 255, 204, 0.1),        /* Base cyan ambient glow */
                inset 0 0 20px rgba(0, 255, 204, 0.05); /* Inner terminal depth */
            padding: 2.5rem;
            border-radius: 4px;
            position: relative;
            z-index: 10;
            /* Added subtle transition in case you add hover effects later */
            transition: box-shadow 0.3s ease; 
        }

        /* UI Decoration */
        .container::before {
            content: "SYS.REQ.GRANTED";
            position: absolute;
            top: -10px;
            left: 10px;
            background: var(--bg);
            padding: 0 10px;
            font-size: 0.8rem;
            color: var(--accent-1);
        }

        h1 {
            text-align: center;
            color: var(--accent-1);
            text-shadow: 0 0 10px var(--accent-1), 2px 2px 0px rgba(188, 19, 254, 0.5);
            margin-bottom: 2rem;
            letter-spacing: 8px;
            font-size: clamp(2.5rem, 6vw, 4rem);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border-bottom: 1px dashed var(--text-main);
            padding-bottom: 10px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #onLineStat {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: lime;
            box-shadow: 0 0 8px lime;
            transition: all 0.3s;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: var(--accent-2);
            text-transform: uppercase;
        }

        select, input, button {
            font-family: inherit;
            background: transparent;
            border: var(--border);
            color: var(--text-main);
            padding: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        select:focus, input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            border-color: var(--accent-1);
        }

        select {
            background: var(--bg);
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        input[type="search"] {
            flex-grow: 1;
        }

        button {
            background: var(--accent-1);
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        button:hover {
            background: var(--accent-2);
            box-shadow: 0 0 15px var(--accent-2);
        }

        /* Mobile Responsiveness */
        @media (max-width: 550px) {
            .search-row {
                flex-direction: column;
            }
            button {
                width: 100%;
                padding: 15px;
            }
            .container {
                padding: 1.5rem;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div id="header">WARN: SYSTEM OFFLINE. NETWORK DISCONNECTED.</div>
    
    <div class="container">
        <h1>E N Y 0</h1>
        
        <div class="controls">
            <div class="status-bar">
                <span>UPLINK: ACTIVE</span>
                <div class="status-indicator">
                    <span>NET_STAT</span>
                    <div id="onLineStat"></div>
                </div>
            </div>

            <div class="input-group">
                <label for="sEngine">Select Target Node</label>
                <select id="sEngine"></select>
            </div>

            <div class="input-group">
                <label for="search">Query Parameters</label>
                <div class="search-row">
                    <input type="search" id="search" placeholder="Enter payload..." autocomplete="off">
                    <button id="searchBtn">EXECUTE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById("search");
        const engineSelect = document.getElementById("sEngine");
        const searchBtn = document.getElementById("searchBtn");
        const onLineStat = document.getElementById("onLineStat");
        const header = document.getElementById("header");

        // Dynamic Engine Library
        const engines = [
            { name: "Google (General / Dorks)", url: "https://www.google.com/search?q=" },
            { name: "DuckDuckGo (Privacy)", url: "https://duckduckgo.com/?q=" },
            { name: "Startpage (Proxied Google)", url: "https://www.startpage.com/sp/search?query=" },
            { name: "Shodan (IoT / Infra)", url: "https://www.shodan.io/search?query=" },
            { name: "Censys (Hosts / Certs)", url: "https://search.censys.io/search?resource=hosts&q=" },
            { name: "Exploit-DB (via Dork)", url: "https://www.google.com/search?q=site:exploit-db.com+" },
            { name: "Wayback Machine (Archive)", url: "https://web.archive.org/web/*/" },
            { name: "GitHub (Code Recon)", url: "https://github.com/search?type=code&q=" },
            { name: "arXiv (Research Papers)", url: "https://arxiv.org/search/?query=" },
            { name: "Yandex (Reverse Img / Eastern Web)", url: "https://yandex.com/search/?text=" },
            { name: "Brave Search (Independent Index)", url: "https://search.brave.com/search?q=" }
        ];

        // Populate the dropdown menu dynamically
        engines.forEach((engine, index) => {
            let option = document.createElement("option");
            option.value = index;
            option.text = engine.name;
            engineSelect.appendChild(option);
        });

        // Modern Network Status Handler
        function updateConnectionStatus() {
            if (navigator.onLine) {
                onLineStat.style.background = "lime";
                onLineStat.style.boxShadow = "0 0 8px lime";
                header.style.display = "none";
            } else {
                onLineStat.style.background = "red";
                onLineStat.style.boxShadow = "0 0 12px red";
                header.style.display = "block";
            }
        }

        // Listen for live network changes
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        updateConnectionStatus(); // Run initial check on load

        // Core Search Execution
        function executeSearch() {
            const query = encodeURIComponent(searchInput.value.trim());
            if (!query) return; // Ignore empty clicks
            
            const selectedEngineUrl = engines[engineSelect.value].url;
            window.location.href = selectedEngineUrl + query;
        }

        // Event Listeners for Execution
        searchBtn.addEventListener('click', executeSearch);
        
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                executeSearch();
            }
        });
    </script>
</body>
</html>
